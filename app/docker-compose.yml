version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-service
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-visitor-counter
    restart: always
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT_NAME=Docker-Compose-Local
      - CLOUD_REGION=local-workstation
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-net

volumes:
  redis_data:

networks:
  app-net:
    driver: bridge
