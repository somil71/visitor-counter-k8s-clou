# Hybrid Cloud Reverse Proxy with Automatic Health-Check Failover
events {
    worker_connections 1024;
}

http {
    upstream hybrid_backend {
        # Primary: Local / On-Premise Kubernetes Cluster (NodePort 30080)
        server 127.0.0.1:30080 max_fails=2 fail_timeout=5s;

        # Secondary: Standby Public Cloud Disaster Recovery Instance (Port 5001)
        server 127.0.0.1:5001 backup;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://hybrid_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Fast timeouts to ensure instant failover upon primary cluster failure
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;

            # Intercept 5xx errors from primary and immediately fall back to secondary
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
